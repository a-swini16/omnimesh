services:
  # Cloudflare Tunnel: Exposes core-api and postgres securely with ZERO open ingress firewall ports
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: omnimesh-cf-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required}
    networks:
      - mesh-net

  # Core API Node
  core-api:
    image: ${DOCKER_IMAGE:-omnimesh-api:latest}
    container_name: omnimesh-core-api
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GATEWAY_SECRET=${GATEWAY_SECRET:?GATEWAY_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/omnimesh
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - OMNIMESH_PROVIDER=oracle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - mesh-net

  # Primary PostgreSQL 16 (Mode B: with WAL logical replication enabled)
  postgres:
    image: postgres:16-alpine
    container_name: omnimesh-postgres-primary
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: omnimesh
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=5
      -c max_wal_senders=5
      -c shared_buffers=512MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d omnimesh']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mesh-net

  # In-Memory Cache & Distributed Lock
  redis:
    image: redis:7-alpine
    container_name: omnimesh-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 2gb --maxmemory-policy allkeys-lru
    networks:
      - mesh-net

networks:
  mesh-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
