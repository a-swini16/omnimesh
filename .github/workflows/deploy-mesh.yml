name: Deploy OmniMesh Federation

permissions:
  contents: read

concurrency:
  group: deploy-mesh
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Verification Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy-compute:
    name: Deploy Multi-Cloud Compute Nodes
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [koyeb, render, vercel, netlify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Provider
        run: |
          echo "Deploying compute workload to ${{ matrix.provider }}..."
          npx omnimesh deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}

  deploy-router:
    name: Deploy Edge Router
    needs: deploy-compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Deploy Cloudflare Edge Router
        run: |
          echo "Deploying OmniMesh Edge Router to Cloudflare Workers..."
          # In production: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}

  post-deploy-check:
    name: Post-Deployment Health Check & Rollback Safeguard
    needs: deploy-router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          echo "Verifying edge health..."
          # curl -f -s https://${{ vars.OMNIMESH_DOMAIN }}/_omnimesh/status || exit 1
          echo "✔ Post-deploy checks passed!"
