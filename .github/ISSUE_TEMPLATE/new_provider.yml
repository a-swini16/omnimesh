name: New provider
description: Propose (or volunteer to build) a provider adapter
labels: [provider, good first issue]
body:
  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: "e.g. Turso"
    validations:
      required: true
  - type: input
    id: pricing
    attributes:
      label: Official pricing / free-tier page
      description: Limits must come from the provider's own docs, not blog posts.
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role in the mesh
      multiple: true
      options: [compute, database, cache, storage, edge-router]
    validations:
      required: true
  - type: dropdown
    id: card
    attributes:
      label: Does sign-up need a credit or debit card?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: The adapter uses one legitimate account and never creates or rotates accounts to avoid limits.
          required: true
